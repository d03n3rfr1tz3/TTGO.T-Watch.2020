on:
  push:
    branches:
      - master
      - experimental

  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

name: Prepare Release Asset

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - t-watch2020-v1
          - t-watch2020-v2
          - t-watch2020-v3
          - t-watch2021-v1
          - t-watch2021-v2
          - m5paper
          - m5core2
          - WT32-SC01_v3_2
          - WT32-SC01_v3_3
          - emulator_twatch2020
          - emulator_twatch2021
          - emulator_m5paper
          - emulator_m5core2
          - emulator_WT32-SC01
    steps:
    - uses: actions/checkout@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-${{ matrix.env }}-
          ${{ runner.os }}-pio-
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Install native libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libcurl4-gnutls-dev libmosquitto-dev build-essential
    - name: Run PlatformIO
      run: pio run -e ${{ matrix.env }}
